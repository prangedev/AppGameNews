worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;                     # não vaza versão do nginx

  log_format main '$remote_addr - $request_id "$request" $status '
                  '$body_bytes_sent rt=$request_time uct="$upstream_connect_time"';
  access_log /var/log/nginx/access.log main;

  # ---- limites anti-DDoS / anti-abuso -------------------------------------
  client_body_timeout       10s;
  client_header_timeout     10s;
  send_timeout              10s;
  keepalive_timeout         30s;
  client_max_body_size      1m;           # payloads pequenos; uploads não são suportados

  limit_req_zone  $binary_remote_addr zone=api:10m   rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=auth:10m  rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  # ---- upstream ----------------------------------------------------------
  upstream api_upstream {
    server api:3000;
    keepalive 32;
  }

  # HTTP -> HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    limit_conn perip 20;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_read_timeout 30s;

    location /auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://api_upstream;
    }

    location / {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api_upstream;
    }
  }
}
